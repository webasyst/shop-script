<form id="s-review-add-form" method="post">
    <div class="flexbox middle space-4">
        <img class="userpic userpic-20" src="{$current_author.photo_url_20}">
        <span>{$current_author.name|escape}</span>
        <button type="button" class="button nobutton gray smaller custom-ml-6 js-ai-answer-button">
            <span class="icon webasyst-magic-wand-ai"></span>
            [`Answer with AI`]
        </button>
    </div>
    <p>
        <textarea name="text"></textarea>
    </p>
    <input type="hidden" name="parent_id" value="0">
    <input type="hidden" name="product_id" value="{if isset($product.id)}{$product.id}{else}0{/if}">
    <div class="bottom-buttons flexbox middle">
        <input type="button" class="button light-gray save smallest" value="[`Add comment`]">
        <div style="width: 4rem;">
            <span class="s-review-add-hint hint">Ctrl+Enter</span>
            <span class="s-review-add-loading" style="display: none;"><i class="fas fa-spinner wa-animation-spin"></i></span>
        </div>
        <button class="s-review-close button nobutton smaller gray custom-px-8 custom-ml-auto" type="button" title="[`Close`]"><i class="fas fa-times"></i></button>
    </div>
</form>
