<div class="s-customer-export-dialog dialog">
    <div class="dialog-background"></div>
    <div class="dialog-body">
        <header class="dialog-header">
            <h3>[`Export to CSV`]</h3>
        </header>
        <div class="dialog-content">
            <p class="small">[`This will export the primary contact information of all selected customers to a CSV file (spreadsheet).`]</p>
            <div class="js-success-text text-green" style="display: none;">
                <i class="fas fa-check-circle"></i> [`Export completed!`]
            </div>
        </div>
        <footer class="dialog-footer">
            <button class="js-submit button green" type="button">
                <span class="js-loading custom-mr-4" style="display: none;"><i class="fas fa-spinner fa-spin"></i></span>
                [`Export`]
            </button>
            <button class="js-close-dialog button light-gray" type="button">[`Cancel`]</button>
        </footer>
    </div>
</div>
<script>
(function() {
    const contact_ids = {$contact_ids|json_encode};
    const url = '?module=customersMass&action=export';
    const $wrapper = $('.s-customer-export-dialog');
    const $submit = $wrapper.find('.js-submit');
    const $close = $wrapper.find('.js-close-dialog');
    const $success_text = $wrapper.find('.js-success-text');

    let a = null;

    $submit.on('click', () => {
        if (a) {
            a.click();
            return;
        }

        $submit.prop('disabled', true);
        $submit.find('.js-loading').show();
        $.ajax({
            url,
            method: 'POST',
            data: { ids: contact_ids },
            xhrFields: { responseType: 'blob' },
            success: function(data, status, xhr) {
                const filename = (xhr.getResponseHeader('Content-Disposition') || '')
                    .match(/filename="?([^"]+)"?/)?.[1] || 'download';

                const file_url = window.URL.createObjectURL(data);
                a = document.createElement('a');
                a.href = file_url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();

                $success_text.show();
            }
        }).always(() => {
            $submit.find('.js-loading').hide();
            $submit.prop('disabled', false);
        });
    });

    $wrapper.data('dialog').onClose = () => {
        if (a) {
            window.URL.revokeObjectURL(a.href);
            a.remove();
        }
    };
})();
</script>
