<div class="s-customer-category-dialog dialog">
    <div class="dialog-background"></div>
    <div class="dialog-body">
        <header class="dialog-header">
            <h3>{if $is_add}[`Add to category`]{else}[`Remove from category`]{/if}</h3>
        </header>
        <div class="dialog-content">
            <ul class="list">
                <li>
                    <label class="flexbox middle space-8">
                        <div class="wa-checkbox">
                            <input type="checkbox" class="js-select-all">
                            <span>
                                <span class="icon"><i class="fas fa-check"></i></span>
                            </span>
                        </div>
                        [`Select all`]
                    </label>
                </li>
                {foreach $categories as $c}
                    <li class="custom-mt-8">
                        <label class="flexbox middle space-8">
                            <div class="wa-checkbox">
                                <input type="checkbox" name="category_id[]" value="{$c.id}">
                                <span>
                                    <span class="icon"><i class="fas fa-check"></i></span>
                                </span>
                            </div>
                            <span class="icon text-gray"><i class="{$wa->shop->convertIcon($c.icon)}"></i></span>
                            <span>{$c.name|escape}</span>
                        </label>
                    </li>
                {/foreach}
            </ul>
        </div>
        <footer class="dialog-footer">
            <div class="state-error-hint custom-mb-8"></div>
            <div>
                <button class="js-submit button" type="button">[`Save`]</button>
                <button class="js-close-dialog button light-gray" type="button">[`Cancel`]</button>
            </div>
        </footer>
    </div>
</div>
<script>
(function() {
    const is_add = {$is_add|json_encode};
    const contact_ids = {$contact_ids|json_encode};
    const add_category_url = '?module=customersMass&action=addCategory';
    const remove_category_url = '?module=customersMass&action=removeCategory';
    const loading_html = '<span class="js-loading custom-mr-4"><i class="fas fa-spinner fa-spin"></i></span>';

    const $wrapper = $('.s-customer-category-dialog');
    const $form = $wrapper.find('form');
    const $submit = $wrapper.find('.js-submit');
    const $select_all = $wrapper.find('.js-select-all');
    const $checkboxes = $wrapper.find('[name="category_id[]"]');
    const $place_for_error = $wrapper.find('.state-error-hint');
    const $categories = $('#customer-categories [data-category-id]');

    $submit.on('click', () => {
        const $checkboxes_checked = $checkboxes.filter(':checked');
        const category_id = $.map($checkboxes_checked, el => +el.value);
        const url = is_add ? add_category_url : remove_category_url;
        const payload = { ids: contact_ids, category_id };

        $place_for_error.empty();
        $submit.prop('disabled', true);
        $submit.prepend(loading_html);
        $.post(url, payload, handleResponse)
            .always(() => {
                $submit.find('.js-loading').remove();
                $submit.prop('disabled', false);
            });
    });

    $select_all.on('change', function() {
        $checkboxes.prop('checked', $(this).is(':checked'));
    });

    function handleResponse (response) {
        if (response.status === 'ok') {
            if (Object.keys(response.data.categories_count).length) {
                $categories.each(function() {
                    const $self = $(this);
                    const category_id = $self.data('category-id');
                    const count = Number(response.data.categories_count[category_id]);
                    if (!isNaN(count)) {
                        $self.find('.count').text(count);
                    }
                });
            }
            $wrapper.data('dialog').close();
            $.customers.redispatch();
        } else if (response.errors) {
            $place_for_error.text(response.errors.error_description);
        }
    }

})();
</script>
